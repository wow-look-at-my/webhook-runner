<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>webhook-runner</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="dashboard.css">
</head>
<body>
<header>
  <h1>webhook-runner</h1>
  <div class="meta">
    <span id="health-badge" class="badge">checking...</span>
    <span id="updated"></span>
  </div>
</header>

<main>
  <section id="setup-section" hidden>
    <h2>Hooks repo</h2>
    <p id="setup-repo"></p>
    <!-- One-time setup info: collapsed by default so it doesn't dominate
         the page; the live state below is what this dashboard is for. -->
    <details id="setup-details">
      <summary>Auto-reload webhook setup instructions</summary>
      <div id="setup-content"></div>
    </details>
  </section>

  <section id="hooks-section">
    <h2>Hooks</h2>
    <table id="hooks-table">
      <thead><tr><th>ID</th><th>Description</th><th>Mode</th><th>URL</th></tr></thead>
      <tbody></tbody>
    </table>
    <p id="hooks-empty" class="empty" hidden>No hooks loaded.</p>
  </section>

  <section id="images-section">
    <h2>Images</h2>
    <table id="images-table">
      <thead><tr><th>Hook</th><th>Current tag</th><th>State</th><th>On disk</th></tr></thead>
      <tbody></tbody>
    </table>
    <p id="images-empty" class="empty" hidden>No hooks loaded.</p>
  </section>

  <section id="runs-section">
    <h2>Recent runs</h2>
    <table id="runs-table">
      <thead><tr><th>Started</th><th>Hook</th><th>Status</th><th>Exit</th><th>Run ID</th></tr></thead>
      <tbody></tbody>
    </table>
    <p id="runs-empty" class="empty" hidden>No runs yet.</p>
  </section>

  <section id="events-section">
    <h2>Activity</h2>
    <table id="events-table">
      <thead><tr><th>Time</th><th>Kind</th><th>What happened</th></tr></thead>
      <tbody></tbody>
    </table>
    <p id="events-empty" class="empty" hidden>Nothing yet.</p>
  </section>
</main>

<!-- Run detail opens as a modal so output is visible immediately, without
     scrolling past the hooks/images/runs/activity tables to the page bottom. -->
<dialog id="run-detail" aria-labelledby="run-detail-title">
  <div class="modal-body">
    <div class="modal-header">
      <h2 id="run-detail-title">Run <code id="run-detail-id"></code></h2>
      <button id="run-detail-close" class="modal-close" aria-label="Close" title="Close (Esc)">&times;</button>
    </div>
    <dl id="run-detail-meta"></dl>
    <h3>Output</h3>
    <pre id="run-detail-output"></pre>
  </div>
</dialog>

<script src="dashboard.js"></script>
</body>
</html>
