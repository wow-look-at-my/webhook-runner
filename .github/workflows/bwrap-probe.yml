name: bwrap probe (temporary)

on:
  push:

jobs:
  matrix:
    runs-on: ${{ vars.CI_RUNNER_DIND || 'ubuntu-latest' }}
    steps:
      - name: Which container flags let bwrap run on this host kernel
        run: |
          echo "== this (privileged dind) container =="
          grep -iE 'Seccomp|CapEff' /proc/self/status
          unshare -U true && echo "USERNS here: ok" || echo "USERNS here: blocked"
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq bubblewrap >/dev/null 2>&1 || echo "install failed"
          bwrap --ro-bind / / --dev /dev --proc /proc --tmpfs /tmp --unshare-pid --die-with-parent true \
            && echo "BWRAP here: works" || echo "BWRAP here: failed"

          echo "== nested-daemon matrix (same host kernel) =="
          docker build -q -t bwrap-probe - <<'DOCKERFILE'
          FROM ubuntu:24.04
          RUN apt-get update -qq && apt-get install -y -qq bubblewrap && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
          for opts in "" "--security-opt seccomp=unconfined" "--cap-add SYS_ADMIN" "--security-opt seccomp=unconfined --cap-add SYS_ADMIN" "--privileged"; do
            printf 'opts [%s]: ' "${opts:-default}"
            docker run --rm $opts bwrap-probe \
              bwrap --ro-bind / / --dev /dev --proc /proc --tmpfs /tmp --unshare-pid --die-with-parent true \
              && echo "WORKS" || echo "FAILED"
          done
