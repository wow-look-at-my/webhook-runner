name: bwrap probe (temporary)

on:
  push:

jobs:
  probe:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: What can this runner container do
        run: |
          echo "== identity =="
          id; echo "virt: $(systemd-detect-virt 2>/dev/null || echo n/a)"
          echo "== userns =="
          echo "max_user_namespaces: $(cat /proc/sys/user/max_user_namespaces 2>/dev/null || echo absent)"
          echo "unprivileged_userns_clone: $(cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || echo absent)"
          echo "apparmor_restrict_unprivileged_userns: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo absent)"
          echo "== confinement =="
          grep -iE 'Seccomp|CapEff|CapBnd' /proc/self/status
          echo "apparmor label: $(cat /proc/self/attr/current 2>/dev/null || echo none)"
          echo "== raw userns test =="
          unshare -U true && echo "USERNS: ok" || echo "USERNS: blocked"
          unshare -Umr true && echo "USERNS+MAP: ok" || echo "USERNS+MAP: blocked"
          echo "== bubblewrap =="
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq bubblewrap >/dev/null 2>&1 || echo "install failed"
          bwrap --version || echo "no bwrap"
          bwrap --ro-bind / / --dev /dev --proc /proc --tmpfs /tmp --unshare-pid --die-with-parent true \
            && echo "BWRAP: works" || echo "BWRAP: failed"
          echo "== docker present? =="
          command -v docker || echo "no docker client (expected on slim)"
