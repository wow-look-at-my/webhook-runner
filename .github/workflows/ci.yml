name: CI

on:
  push:

permissions:
  id-token: write
  contents: write
  packages: write
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The go:generate directive (internal/server/dashboard/dashboard.go)
      # rebuilds the dashboard's timeline.js via ts0, which needs Node 22 and
      # clones the private wow-look-at-my/ts0 repo — npm falls back from the
      # unauthenticated codeload tarball to a git clone, so authenticate the
      # https (and npm's canonical ssh) GitHub URLs for the org.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Authenticate git for the private ts0 install
        run: |
          git config --global url."https://x-access-token:${{ secrets.PRIVATE_ORG_REPO_READ }}@github.com/wow-look-at-my/".insteadOf "https://github.com/wow-look-at-my/"
          git config --global --add url."https://x-access-token:${{ secrets.PRIVATE_ORG_REPO_READ }}@github.com/wow-look-at-my/".insteadOf "ssh://git@github.com/wow-look-at-my/"
      - uses: wow-look-at-my/go-toolchain@v1
        with:
          autorelease: true
          # Approval hash for the //go:generate directive above — it changes
          # whenever the directive's text changes (a failing run prints the
          # new one; update it here and in CLAUDE.md).
          generate: e5b4190bd967
      # go-toolchain just regenerated the committed bundle in the workspace:
      # a stale assets/timeline.js — or one whose TypeScript no longer
      # type-checks (ts0 fails the generate step directly) — turns the build
      # red here instead of shipping.
      - name: Generated dashboard assets are fresh
        run: git diff --exit-code -- internal/server/dashboard/assets/

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/actions@download-exe#latest
        with:
          name: go-build
          path: build
          files: webhook-runner_linux_amd64:webhook-runner
      # The sops e2e tests decrypt e2e/hooks/sops-hook/secrets.sops.env with
      # the committed test-only age key.
      - name: Install sops
        run: |
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.13.1/sops-v3.13.1.linux.amd64 -o /tmp/sops
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops
          sops --version
      - uses: wow-look-at-my/actions@typescript#latest
        with:
          file: e2e/e2e.test.ts

  # Builds the Dockerfile from the prebuilt go-build artifact and pushes
  # ghcr.io/wow-look-at-my/webhook-runner:latest (only on master). The deployed
  # compose pulls this image; the push notifies docker-updater (GitHub package webhook).
  publish-ghcr:
    needs: e2e
    uses: wow-look-at-my/actions/.github/workflows/publish-ghcr.yml@master
    # The reusable workflow's optional `updater-webhook-secret` notify is intentionally unwired:
    # docker-updater is notified by the container push itself (GitHub package webhook on the GHCR
    # push), so the CI-side notify is redundant here. Pass `updater-webhook-secret` if that ever changes.
