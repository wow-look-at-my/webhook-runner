name: CI

on:
  push:

permissions:
  id-token: write
  contents: write
  packages: write
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The committed dashboard bundle (assets/timeline.js) and the committed
      # component .d.ts pair (ts/js-snippets/) are regenerated by the
      # //go:generate one-liner in internal/server/dashboard/dashboard.go:
      # curl a pinned ts0 from buildhost + the .d.ts from js-snippets' Pages,
      # then `node ts0.cjs build` — no npm/npx, no git auth; Node 22 via
      # setup-node. `generate:` is the approval hash for that directive (a
      # bare go-toolchain run prints the new one after any directive edit).
      # The freshness gate then fails CI on any diff, so the bundle and the
      # fetched declarations can't go stale — and an upstream component API
      # change turns CI red here instead of drifting.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: wow-look-at-my/go-toolchain@v1
        with:
          autorelease: true
          generate: 1f9fcccd8c19
      - name: Generated assets are fresh
        run: git diff --exit-code -- internal/server/dashboard/assets/ internal/server/dashboard/ts/js-snippets/

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/actions@download-exe#latest
        with:
          name: go-build
          path: build
          files: webhook-runner_linux_amd64:webhook-runner
      # The sops e2e tests decrypt e2e/hooks/sops-hook/secrets.sops.env with
      # the committed test-only age key.
      - name: Install sops
        run: |
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.13.1/sops-v3.13.1.linux.amd64 -o /tmp/sops
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops
          sops --version
      - uses: wow-look-at-my/actions@typescript#latest
        with:
          file: e2e/e2e.test.ts

  # Builds the Dockerfile from the prebuilt go-build artifact and pushes
  # ghcr.io/wow-look-at-my/webhook-runner:latest (only on master). The deployed
  # compose pulls this image; the push notifies docker-updater (GitHub package webhook).
  publish-ghcr:
    needs: e2e
    uses: wow-look-at-my/actions/.github/workflows/publish-ghcr.yml@master
    # The reusable workflow's optional `updater-webhook-secret` notify is intentionally unwired:
    # docker-updater is notified by the container push itself (GitHub package webhook on the GHCR
    # push), so the CI-side notify is redundant here. Pass `updater-webhook-secret` if that ever changes.
