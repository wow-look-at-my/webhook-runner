name: CI

on:
  push:

permissions:
  id-token: write
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@v1
        with:
          autorelease: true

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@v1
      - uses: wow-look-at-my/actions@typescript#latest
        with:
          script: |
            await exec.exec('npm', ['install'], { cwd: 'e2e' });
            await exec.exec('node', ['--import', 'tsx', '--test', 'e2e.test.ts'], { cwd: 'e2e' });
