name: CI

on:
  push:

permissions:
  id-token: write
  contents: write
  packages: write
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@v1
        with:
          autorelease: true

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/actions@download-exe#latest
        with:
          name: go-build
          path: build
          files: webhook-runner_linux_amd64:webhook-runner
      # The sops e2e tests decrypt e2e/hooks/sops-hook/secrets.sops.env with
      # the committed test-only age key.
      - name: Install sops
        run: |
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.13.1/sops-v3.13.1.linux.amd64 -o /tmp/sops
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops
          sops --version
      - uses: wow-look-at-my/actions@typescript#latest
        with:
          file: e2e/e2e.test.ts

  # Builds the Dockerfile from the prebuilt go-build artifact and pushes
  # ghcr.io/wow-look-at-my/webhook-runner:latest (only on master). The
  # deployed compose pulls this image and docker-updater watches its digest.
  publish-ghcr:
    needs: e2e
    uses: wow-look-at-my/actions/.github/workflows/publish-ghcr.yml@master
    secrets:
      # Signs the "Notify docker-updater" webhook so the host redeploys the
      # moment the image is pushed, instead of waiting for digest polling.
      # Must match DOCKER_UPDATER_GITHUB_WEBHOOK_SECRET on the server. An
      # explicit mapping is required — `secrets: inherit` cannot satisfy the
      # hyphenated `updater-webhook-secret` name (GitHub secret names only
      # allow [A-Za-z0-9_]). If the publish job still logs "no updater
      # secret; skipping", the org/repo secret name below doesn't exist yet.
      updater-webhook-secret: ${{ secrets.DOCKER_UPDATER_GITHUB_WEBHOOK_SECRET }}
