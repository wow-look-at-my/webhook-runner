name: CI

on:
  push:

permissions:
  id-token: write
  contents: write
  packages: write
  actions: read
  # go-toolchain's no-all-builds-job guard reads check runs -- README.md "workflow permissions: checks read".
  checks: read
  # Publishing registers a Deployment and an artifact record -- README.md "workflow permissions: deployments and artifact-metadata".
  deployments: write
  artifact-metadata: write

jobs:
  # Fails when the committed dashboard bundle drifts from ts/ -- README.md "dashboard-assets".
  dashboard-assets:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # ?v=N is an immutable pin: do NOT bump it blind -- README.md "dashboard-assets: installing ts0".
      - name: Install ts0 (prebuilt, from buildhost)
        run: curl -fSL "https://dl.pazer.build/ts0?v=10&os=linux&arch=amd64" -o /tmp/ts0.cjs
      # Type-checks ts/ and rebuilds the bundle in place -- README.md "dashboard-assets: regenerating the bundle".
      - name: Regenerate dashboard bundle
        run: node /tmp/ts0.cjs build
        working-directory: internal/server/dashboard
      - name: Check the committed bundle is up to date
        run: |
          if ! git diff --quiet -- internal/server/dashboard/assets/timeline.js; then
            echo "::error::assets/timeline.js is stale — it does not match a fresh ts0 build of ts/."
            echo "Regenerate and commit it:"
            echo "  curl -fSL 'https://dl.pazer.build/ts0?v=10&os=linux&arch=amd64' -o /tmp/ts0.cjs"
            echo "  (cd internal/server/dashboard && node /tmp/ts0.cjs build)"
            echo "Diff:"
            git --no-pager diff -- internal/server/dashboard/assets/timeline.js
            exit 1
          fi
          echo "assets/timeline.js matches its source."

  # wow-dind, not wow-linux: go-toolchain's dats phase sandboxes -- README.md "test: why wow-dind".
  test:
    runs-on: ${{ vars.CI_RUNNER_DIND || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      # Do NOT add an explicit `cache-upload go-build` here -- README.md "test: no explicit cache-upload".
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: wow-look-at-my/go-toolchain@v1
        with:
          autorelease: true
          # Native binaries, not the default fat APE: bbolt needs a real libc -- README.md "test: native binaries, not the fat APE".
          os: linux,darwin,windows
          arch: amd64,arm64
          # The approval hash for dashboard.go's //go:generate -- README.md "test: the generate hash and the freshness gate".
          generate: 884c0f21fd82
      - name: Generated assets are fresh
        run: git diff --exit-code -- internal/server/dashboard/assets/ internal/server/dashboard/ts/js-snippets/

  e2e:
    runs-on: ${{ vars.CI_RUNNER_DIND || 'ubuntu-latest' }}
    needs: test
    steps:
      - uses: actions/checkout@v4
      # Drives the real committed assets in vm sandboxes -- README.md "e2e: the dashboard client harnesses".
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dashboard client harness
        run: node --experimental-strip-types --test internal/server/dashboard/testjs/*.test.ts
      # Restores the test job's go-build hand-off -- README.md "e2e: restoring the binary".
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build
          path: build
      # The harness runs ./build/webhook-runner, unsuffixed -- README.md "e2e: staging the binary".
      - name: Stage e2e binary
        run: install -m 0755 build/webhook-runner_linux_amd64 build/webhook-runner
      # The sops e2e tests decrypt a committed test-only age key -- README.md "e2e: installing sops".
      - name: Install sops
        run: |
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.13.1/sops-v3.13.1.linux.amd64 -o /tmp/sops
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops
          sops --version
      - uses: wow-look-at-my/actions@typescript#latest
        with:
          file: e2e/e2e.test.ts

  # Black-box CLI-contract tests against the built binary -- README.md "dats".
  dats:
    runs-on: ${{ vars.CI_RUNNER_DIND || 'ubuntu-latest' }}
    needs: test
    steps:
      - uses: actions/checkout@v4
      # The same central go-build hand-off the e2e job restores.
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build
          path: build
      # The suites fall back to build/webhook-runner here -- README.md "dats: staging the CLI binary".
      - name: Stage CLI binary
        run: install -m 0755 build/webhook-runner_linux_amd64 build/webhook-runner
      # Prebuilt from buildhost into build/, so one PATH prepend covers both -- README.md "dats: installing dats".
      - name: Install dats
        run: |
          curl -fSL "https://dl.pazer.build/dats?os=linux&arch=amd64" -o build/dats
          chmod +x build/dats
          build/dats version
      - name: Run CLI contract tests
        run: PATH="$PWD/build:$PATH" dats test dats

  # Would deploying THIS binary break the running fleet? -- README.md "fleet-compat".
  fleet-compat:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build
          path: build
      - uses: wow-look-at-my/actions@secret-server#latest
      # An empty token must FAIL, never skip -- README.md "fleet-compat: why an empty token fails".
      - uses: wow-look-at-my/actions@typescript#latest
        with:
          script: |
            if (!process.env.PRIVATE_ORG_REPO_READ) {
              core.setFailed(
                'PRIVATE_ORG_REPO_READ is empty, so the deployed hooks tree cannot be read. ' +
                  'This job passing without checking would claim the binary is safe to deploy ' +
                  'when nothing verified it.',
              );
            }
      - uses: actions/checkout@v4
        with:
          repository: wow-look-at-my/webhooks
          ref: master
          path: _webhooks_master
          token: ${{ env.PRIVATE_ORG_REPO_READ }}
      # The paired tree, when one exists; a missing branch is normal -- README.md "fleet-compat: the paired checkout".
      - uses: actions/checkout@v4
        id: paired
        continue-on-error: true
        with:
          repository: wow-look-at-my/webhooks
          ref: ${{ github.ref_name }}
          path: _webhooks_paired
          token: ${{ env.PRIVATE_ORG_REPO_READ }}
      # validate is docker-free: it loads and checks manifests, builds nothing.
      - uses: wow-look-at-my/actions@typescript#latest
        with:
          script: |
            const bin = 'build/webhook-runner_linux_amd64';
            const check = async (dir: string) => {
              const r = await $`${bin} validate ${dir}`.silent().nothrow();
              return { ok: r.exitCode === 0, out: `${r.stdout}\n${r.stderr}`.trim() };
            };

            const master = await check('_webhooks_master');
            const pairedRef = ${{ toJSON(steps.paired.outcome == 'success') }} ? '${{ github.ref_name }}' : null;
            const paired = pairedRef ? await check('_webhooks_paired') : null;

            core.info(`webhooks master: ${master.ok ? 'LOADS' : 'REFUSED'}`);
            if (!master.ok) core.info(master.out);
            if (paired) core.info(`webhooks@${pairedRef}: ${paired.ok ? 'LOADS' : 'REFUSED'}`);
            if (paired && !paired.ok) core.info(paired.out);

            // The gate: SOMETHING this change ships with must be servable.
            if (paired ? !paired.ok : !master.ok) {
              const which = paired ? `its paired tree webhooks@${pairedRef}` : 'webhooks master';
              core.setFailed(
                `This binary cannot load ${which}. Nothing this change ships with can be served by it, ` +
                  `so there is no order in which it becomes deployable. Fix the manifests or the loader.\n` +
                  (paired ? paired.out : master.out),
              );
              return;
            }

            if (!master.ok) {
              // The deployable state exists, just not on master yet. Say why the wrong order is survivable, so nobody rebuilds a runbook the runtime enforces.
              core.notice(
                `DEPLOY ORDER: merge wow-look-at-my/webhooks@${pairedRef} FIRST. ` +
                  `This binary cannot load webhooks master (it can load the paired tree), so until that lands ` +
                  `a deploy of this image REFUSES TO START rather than serving a partial fleet — the previous ` +
                  `container keeps serving and the failed rollout is visible. Merging in either order is safe; ` +
                  `this order is simply the one with no failed deploy in it.`,
              );
            }

  # Builds the image; the push is gated to master by the reusable workflow -- README.md "publish-ghcr".
  publish-ghcr:
    needs: e2e
    uses: wow-look-at-my/actions/.github/workflows/publish-ghcr.yml@master
    # updater-webhook-secret is deliberately unwired -- README.md "publish-ghcr".
