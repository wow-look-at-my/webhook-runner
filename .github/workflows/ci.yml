name: CI

on:
  push:

permissions:
  id-token: write
  contents: write
  packages: write
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The dashboard's committed assets/timeline.js is authoritative and
      # embedded as-is — the npx //go:generate directive that rebuilt it via
      # ts0 was removed (no node/npm/npx anywhere in this build). Regeneration
      # is temporarily a manual step; a buildhost-served prebuilt ts0 binary
      # driven by a small Go bootstrap is landing next.
      - uses: wow-look-at-my/go-toolchain@v1
        with:
          autorelease: true

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      # Dashboard client harnesses: drive the real committed assets
      # (dashboard.js — the push-first section feed; timeline.js — the
      # stream-vouched trailing-coverage claims) in vm sandboxes. The shell
      # glob picks up every testjs/*.test.mjs (node's bare-directory form
      # is not portable across 22.x). Plain `node --test`, no dependencies.
      - name: Dashboard client harness
        run: node --test internal/server/dashboard/testjs/*.test.mjs
      # Build the webhook-runner binary in-job with go-toolchain, replacing the
      # download-exe step that pulled the `go-build` GitHub Actions artifact — so
      # the e2e job needs no GitHub Actions artifact storage at all (unusable
      # during the org-wide artifact-storage outage). go-toolchain is
      # all-or-nothing (builds AND runs the unit suite), so this also re-runs the
      # unit tests — the deliberate tradeoff for a fully artifact-free e2e path
      # with no bare `go build`.
      - uses: wow-look-at-my/go-toolchain@v1
      # go-toolchain's `matrix` build emits platform-named binaries
      # (build/webhook-runner_<os>_<arch>); e2e.test.ts spawns build/webhook-runner
      # (the old download-exe step did this rename on download). Materialize the
      # linux/amd64 binary (the runner's platform) as a real file at that path.
      - name: Stage the host binary at build/webhook-runner for e2e
        run: |
          set -euo pipefail
          ls -la build/
          rm -f build/webhook-runner
          cp build/webhook-runner_linux_amd64 build/webhook-runner
          chmod +x build/webhook-runner
      # The sops e2e tests decrypt e2e/hooks/sops-hook/secrets.sops.env with
      # the committed test-only age key.
      - name: Install sops
        run: |
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.13.1/sops-v3.13.1.linux.amd64 -o /tmp/sops
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops
          sops --version
      - uses: wow-look-at-my/actions@typescript#latest
        with:
          file: e2e/e2e.test.ts

  # Builds the Dockerfile from the prebuilt go-build artifact and pushes
  # ghcr.io/wow-look-at-my/webhook-runner:latest (only on master). The deployed
  # compose pulls this image; the push notifies docker-updater (GitHub package webhook).
  publish-ghcr:
    needs: e2e
    uses: wow-look-at-my/actions/.github/workflows/publish-ghcr.yml@master
    # The reusable workflow's optional `updater-webhook-secret` notify is intentionally unwired:
    # docker-updater is notified by the container push itself (GitHub package webhook on the GHCR
    # push), so the CI-side notify is redundant here. Pass `updater-webhook-secret` if that ever changes.
