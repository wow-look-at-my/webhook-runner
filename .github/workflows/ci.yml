name: CI

on:
  push:

permissions:
  id-token: write
  contents: write
  packages: write
  actions: read
  # go-toolchain's no-all-builds-job guard reads check runs.
  checks: read
  # Publishing registers a Deployment and an artifact record.
  deployments: write
  artifact-metadata: write

jobs:
  # Fails when the committed dashboard bundle drifts from ts/.
  dashboard-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # A higher ?v= is not a newer master -- docs/internals/shim-and-timeline.md.
      - name: Install ts0 (prebuilt, from buildhost)
        run: curl -fSL "https://dl.pazer.build/ts0?v=10&os=linux&arch=amd64" -o /tmp/ts0.cjs
      # timeline.js is built, not committed, so this type-checks ts/ instead.
      - name: Build the dashboard bundle
        run: node /tmp/ts0.cjs build
        working-directory: internal/server/dashboard
      - name: Check the build produced the bundle
        run: test -s internal/server/dashboard/assets/timeline.js

  # GitHub-hosted, not wow-dind: go-toolchain's dats phase needs a sandbox backend.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Do NOT add an explicit `cache-upload go-build` here.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: wow-look-at-my/go-toolchain@lkgb
        with:
          autorelease: true
          # Native binaries, not the default fat APE: bbolt needs a real libc.
          os: linux,darwin,windows
          arch: amd64,arm64
          # The approval hash for dashboard.go's //go:generate.
          generate: 884c0f21fd82
      - name: Generated assets are fresh
        run: git diff --exit-code -- internal/server/dashboard/assets/ internal/server/dashboard/ts/js-snippets/

  # GitHub-hosted: the suite starts real containers.
  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The harness reads assets/timeline.js, which is built, not committed.
      - name: Build the dashboard bundle
        run: |
          curl -fSL "https://dl.pazer.build/ts0?v=10&os=linux&arch=amd64" -o /tmp/ts0.cjs
          (cd internal/server/dashboard && node /tmp/ts0.cjs build)
      - name: Dashboard client harness
        run: node --experimental-strip-types --test internal/server/dashboard/testjs/*.test.ts
      # Restores the test job's go-build hand-off.
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build
          path: build
      # The sops e2e tests decrypt a committed test-only age key.
      - name: Install sops
        run: |
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.13.1/sops-v3.13.1.linux.amd64 -o /tmp/sops
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops
          sops --version
      - name: Run e2e tests
        uses: wow-look-at-my/actions@typescript#latest
        with:
          file: e2e/e2e.test.ts

  # Black-box CLI-contract tests against the built binary; GitHub-hosted for the sandbox.
  dats:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      # The same central go-build hand-off the e2e job restores.
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build
          path: build
      # Prebuilt from buildhost into build/, so one PATH prepend covers both.
      - name: Install dats
        run: |
          curl -fSL "https://dl.pazer.build/dats?os=linux&arch=amd64" -o build/dats
          chmod +x build/dats
          build/dats version
      - name: Run CLI contract tests
        run: PATH="$PWD/build:$PATH" dats test dats

  # Would deploying THIS binary break the running fleet?
  fleet-compat:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build
          path: build
      - uses: wow-look-at-my/actions@secret-server#latest
      # An empty token must FAIL, never skip.
      - name: Require the secret-server token
        uses: wow-look-at-my/actions@typescript#latest
        with:
          script: |
            if (!process.env.PRIVATE_ORG_REPO_READ) {
              core.setFailed(
                'PRIVATE_ORG_REPO_READ is empty, so the deployed hooks tree cannot be read. ' +
                  'This job passing without checking would claim the binary is safe to deploy ' +
                  'when nothing verified it.',
              );
            }
      - uses: actions/checkout@v4
        with:
          repository: wow-look-at-my/webhooks
          ref: master
          path: _webhooks_master
          token: ${{ env.PRIVATE_ORG_REPO_READ }}
      # The paired tree, when one exists; a missing branch is normal.
      - uses: actions/checkout@v4
        id: paired
        continue-on-error: true
        with:
          repository: wow-look-at-my/webhooks
          ref: ${{ github.ref_name }}
          path: _webhooks_paired
          token: ${{ env.PRIVATE_ORG_REPO_READ }}
      # validate is docker-free: it loads and checks manifests, builds nothing.
      - name: Check deployability against webhooks master and paired branch
        uses: wow-look-at-my/actions@typescript#latest
        with:
          script: |
            const bin = 'build/webhook-runner';
            const check = async (dir: string) => {
              const r = await $`${bin} validate ${dir}`.silent().nothrow();
              return { ok: r.exitCode === 0, out: `${r.stdout}\n${r.stderr}`.trim() };
            };

            const master = await check('_webhooks_master');
            const pairedRef = ${{ toJSON(steps.paired.outcome == 'success') }} ? '${{ github.ref_name }}' : null;
            const paired = pairedRef ? await check('_webhooks_paired') : null;

            core.info(`webhooks master: ${master.ok ? 'LOADS' : 'REFUSED'}`);
            if (!master.ok) core.info(master.out);
            if (paired) core.info(`webhooks@${pairedRef}: ${paired.ok ? 'LOADS' : 'REFUSED'}`);
            if (paired && !paired.ok) core.info(paired.out);

            // The gate: SOMETHING this change ships with must be servable.
            if (paired ? !paired.ok : !master.ok) {
              const which = paired ? `its paired tree webhooks@${pairedRef}` : 'webhooks master';
              core.setFailed(
                `This binary cannot load ${which}. Nothing this change ships with can be served by it, ` +
                  `so there is no order in which it becomes deployable. Fix the manifests or the loader.\n` +
                  (paired ? paired.out : master.out),
              );
              return;
            }

            if (!master.ok) {
              // The deployable state exists, just not on master yet. Say why the wrong order is survivable, so nobody rebuilds a runbook the runtime enforces.
              core.notice(
                `DEPLOY ORDER: merge wow-look-at-my/webhooks@${pairedRef} FIRST. ` +
                  `This binary cannot load webhooks master (it can load the paired tree), so until that lands ` +
                  `a deploy of this image REFUSES TO START rather than serving a partial fleet — the previous ` +
                  `container keeps serving and the failed rollout is visible. Merging in either order is safe; ` +
                  `this order is simply the one with no failed deploy in it.`,
              );
            }

  # Builds the image; the push is gated to master by the reusable workflow.
  publish-ghcr:
    needs: e2e
    uses: wow-look-at-my/actions/.github/workflows/publish-ghcr.yml@master
    # updater-webhook-secret is deliberately unwired.
